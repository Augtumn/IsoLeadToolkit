name: Quality Gate

on:
  push:
    branches:
      - main
      - dev
      - epic/**
  pull_request:

jobs:
  test-and-guard:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest --tb=line 2>&1 | Tee-Object -FilePath pytest-output.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Annotate test failures
        if: failure()
        run: |
          if (Test-Path pytest-output.txt) {
            Get-Content pytest-output.txt | Select-String -Pattern '^(FAILED|ERROR)' | Select-Object -First 30 | ForEach-Object { "::error::$($_.Line)" }
            if (-not (Select-String -Path pytest-output.txt -Pattern '^(FAILED|ERROR)' -Quiet)) {
              Get-Content pytest-output.txt -Tail 30 | ForEach-Object { "::error::$($_)" }
            }
          } else {
            "::error::pytest produced no output file"
          }

      - name: Check app_state direct assignments
        run: python scripts/check_state_mutations.py --fail-on-hits

      - name: Check gateway direct state assignments
        run: python scripts/check_gateway_direct_state_assignments.py --fail-on-hits

      - name: Check gateway generic mutations
        run: python scripts/check_gateway_generic_mutations.py --fail-on-hits

      - name: Check state dict in-place mutations
        run: python scripts/check_state_dict_mutations.py --fail-on-hits
