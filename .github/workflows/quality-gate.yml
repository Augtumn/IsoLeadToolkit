name: Quality Gate

on:
  push:
    branches:
      - main
      - dev
      - epic/**
  pull_request:

jobs:
  test-and-guard:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest --junitxml=pytest-junit.xml

      - name: Annotate test failures
        if: failure()
        run: |
          if (Test-Path pytest-junit.xml) {
            [xml]$xml = Get-Content pytest-junit.xml
            $cases = $xml.testsuites.testsuite | ForEach-Object { $_.testcase }
            $failed = $cases | Where-Object { $_.failure -or $_.error }
            if ($failed) {
              foreach ($tc in $failed | Select-Object -First 30) {
                $msg = "$($tc.failure.message) $($tc.error.message)" -replace "`r?`n", ' '
                if ($msg.Length -gt 300) { $msg = $msg.Substring(0, 300) }
                "::error file=tests/$($tc.name).py::$($tc.classname)::$($tc.name) - $msg"
              }
            } else {
              "::error::pytest reported no failures in JUnit XML (collection error?)"
            }
          } else {
            "::error::pytest produced no JUnit XML (crash before report?)"
          }

      - name: Check app_state direct assignments
        run: python scripts/check_state_mutations.py --fail-on-hits

      - name: Check gateway direct state assignments
        run: python scripts/check_gateway_direct_state_assignments.py --fail-on-hits

      - name: Check gateway generic mutations
        run: python scripts/check_gateway_generic_mutations.py --fail-on-hits

      - name: Check state dict in-place mutations
        run: python scripts/check_state_dict_mutations.py --fail-on-hits
